# =============================================================
# GitHub Actions：tag 推送自动构建镜像并发布到 ghcr.io
# 触发：推送 v* tag（发版）或手动 workflow_dispatch
# 产物：ghcr.io/<owner>/openbb-cn:<tag> 与 :latest（双标签）
# 架构：linux/amd64 + linux/arm64；GHA 层缓存加速增量构建
# 权限：仅用内置 GITHUB_TOKEN，无需额外 secrets
# =============================================================

name: docker-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo，action 内自动小写化

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata（版本标签 + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 注意：不用 is_default_branch 条件——tag push 事件下它恒为 false，
            # latest 会永远打不上；本 workflow 仅 tag/dispatch 触发，无条件 latest 安全
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
