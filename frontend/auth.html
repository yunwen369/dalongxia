<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问口令 · 大龙虾投研工作台</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    /* 独立登录页：不依赖 theme.css，保证任何主题下都可读 */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f5f6f8; color: #1f2329;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(92vw, 380px); padding: 32px 28px;
      background: #fff; border: 1px solid #e3e6eb; border-radius: 14px;
      box-shadow: 0 8px 28px rgba(16, 24, 40, .08);
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2f6fed; }
    .brand span { font-size: 12px; letter-spacing: .06em; color: #8a919e; }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { font-size: 13px; line-height: 1.65; color: #6b7280; margin: 0 0 20px; }
    label { display: block; font-size: 12px; color: #5a6270; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid #d3d8e0; border-radius: 8px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="password"]:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47, 111, 237, .12); }
    button {
      width: 100%; margin-top: 14px; padding: 10px;
      font-size: 14px; font-weight: 500; color: #fff; background: #2f6fed;
      border: 0; border-radius: 8px; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #255cc4; }
    .err { display: none; margin-top: 12px; font-size: 12px; color: #d64545; }
    .err.on { display: block; }
    .hint { margin-top: 18px; padding-top: 14px; border-top: 1px solid #eef0f4; font-size: 12px; color: #8a919e; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><i class="dot"></i><span>大龙虾投研工作台</span></div>
    <h1>需要访问口令</h1>
    <p>这是一台本地运行的投研工作台。输入口令后，本浏览器 7 天内免输入。</p>
    <!-- AR-02（REQ-20261109-01）：改 POST 提交，口令不进 URL/浏览器历史；成功后 Cookie 为随机会话而非口令原文 -->
    <form method="post" action="/auth">
      <label for="token">访问口令</label>
      <input id="token" type="password" name="token" placeholder="请输入口令"
             autofocus autocomplete="current-password" required>
      <button type="submit">进入工作台</button>
    </form>
    <div class="err" id="err">口令不正确，请重试</div>
    <div class="hint">忘记口令：在本机执行 <code>setx OPENBB_ACCESS_PASSWORD 新口令</code> 后重启工作台。</div>
  </div>
  <script>
    // 服务端校验失败会 303 回 /auth?error=1，这里据此显示错误提示
    if (location.search.indexOf("error=1") > -1) {
      document.getElementById("err").classList.add("on");
      document.getElementById("token").value = "";
    }
  </script>
</body>
</html>
